<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Mejorada</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        table {
            width: 80%;
            max-width: 800px;
            border-collapse: separate;
            border-spacing: 15px; /* Aumenta el espacio entre celdas */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden; /* Para que los bordes redondeados se apliquen correctamente */
        }
        th, td {
            padding: 18px 20px; /* Más padding para celdas más espaciosas */
            text-align: center;
            border: none; /* Eliminamos bordes directos de th y td */
        }
        thead tr {
            background-color: #4CAF50; /* Un verde vibrante para la cabecera */
            color: white;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px; /* Bordes redondeados para la fila de cabecera */
        }
        tbody tr:nth-child(even) {
            background-color: #e8f5e9; /* Un verde muy claro para filas pares */
        }
        tbody tr:nth-child(odd) {
            background-color: #ffffff; /* Blanco para filas impares */
        }
        tbody tr:hover {
            background-color: #c8e6c9; /* Verde al pasar el ratón */
            transition: background-color 0.3s ease;
        }
        th {
            font-weight: 600; /* Fuente un poco más gruesa para encabezados */
        }
        td {
            font-weight: 400; /* Fuente normal para datos */
            color: #333;
        }
        /* Estilo para la celda que puede tener menos contenido */
        tr td:last-child,
        tr th:last-child {
            text-align: right; /* Opcional: alinear a la derecha si tiene menos contenido */
        }
        /* Ajuste para la última fila que tiene menos celdas */
        tbody tr:last-child {
            background-color: #f1f8e9; /* Un verde aún más pálido para resaltar la última fila */
        }
        tbody tr:last-child th:nth-child(2),
        tbody tr:last-child td:nth-child(2) {
            /* Si la segunda celda de la última fila existiera, se aplicaría aquí */
        }
        caption {
            caption-side: top;
            font-size: 1.8em;
            font-weight: bold;
            color: #2e7d32; /* Un verde oscuro para el título */
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <table>
        <caption>Información de Liberia</caption>
        <thead>
            <tr>
                <th>Nosotros</th>
                <th>Somos</th>
                <th>De Liberia</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Estamos</td>
                <td>Para Servirles</td>
                <td>Ubicación: Liberia</td>
            </tr>
            <tr>
                <th>Liberia, Guanacaste</th>
                <td>Hola</td>
                <td></td> <!-- Celda vacía para mantener la estructura si es necesario -->
            </tr>
        </tbody>
    </table>

    <script>
        // JavaScript (opcional para efectos o interactividad)
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Tabla mejorada cargada.");

            // Ejemplo de interactividad: agregar una clase a una celda al hacer clic
            const cells = document.querySelectorAll('td, th');
            cells.forEach(cell => {
                cell.addEventListener('click', () => {
                    cell.classList.toggle('clicked');
                    setTimeout(() => {
                        cell.classList.remove('clicked');
                    }, 500); // Eliminar la clase después de 0.5 segundos
                });
            });

            // Ejemplo: hacer que el título sea interactivo
            const caption = document.querySelector('caption');
            caption.addEventListener('mouseover', () => {
                caption.style.color = '#1b5e20'; // Un verde más oscuro al pasar el ratón
            });
            caption.addEventListener('mouseout', () => {
                caption.style.color = '#2e7d32'; // Volver al color original
            });
        });
    </script>

    <style>
        /* Estilo adicional para la clase 'clicked' */
        .clicked {
            transform: scale(1.05);
            background-color: #dcedc8 !important; /* Un verde muy claro al hacer clic */
            transition: all 0.3s ease;
        }
    </style>

</body>
</html>
